 sed_activation_tt:0 "Use the Enable Smart Economy Director decision."
 sed_disabled_desc:0 "Diagnostics disabled."
 sed_enable:0 "Enable Smart Economy Director"
 sed_enable_desc:0 "Opens an economic diagnosis in the journal and reads current indicators. Enabling is optional, including in existing saves."
 sed_disable_decision:0 "Disable Smart Economy Director"
 sed_disable_decision_desc:0 "Removes the diagnosis and clears its readings and history. Use the enable decision to return."
 sed_title:0 "Economy and construction"
 sed_scope_note:0 "Economic diagnosis and recommendations. Assisted allows button approval; Automatic may queue at most one level per month."
 sed_mode_title:0 "Operating mode"
 sed_mode_manual_button:0 "Manual"
 sed_mode_manual_button_tt:0 "Diagnosis and recommendations on request only. No construction is approved or executed automatically."
 sed_mode_assisted_button:0 "Assisted"
 sed_mode_assisted_button_tt:0 "Shows visible buttons so you can approve each recommended level individually. No automatic economic action."
 sed_mode_automatic_button:0 "Automatic"
 sed_mode_automatic_button_tt:0 "When Economy Advisor or Supply Chain is detected, saves verified construction, objective and budget options and takes construction coordination: one external executor per objective, subject to initial fiscal policy. Leaving Automatic restores previous options. Without detected tools, uses its own executor limited to one monthly attempt. Does not control PMs, taxes or ARoAI."
 sed_mode_manual_status:0 "Manual: readings and recommendations, without construction."
 sed_mode_assisted_status:0 "Assisted: approve one expansion using its button."
