 sed_admin_title:0 "Government administration"
 sed_admin_note:0 "When the plan asks for administrative capacity (negative national bureaucracy) or tax capacity (a state using more than it has), Automatic expands government administration one level per month in an incorporated state that accepts the building. It is the same work the Supply Chain would do; without it, the Director does it itself. It respects the private queue, pause, fiscal guard, material budget and the one-attempt-per-month limit. A building with a level already queued waits for the queue."
 sed_admin_needed:0 "The current objective is to restore administrative or tax capacity. This is the work Automatic can queue."
 sed_admin_success:0 "Government administration request queued (+1 level). Check cost and time in the game queue."
 sed_admin_failed:0 "The game did not confirm government administration was added to the queue."
 sed_power_title:0 "Power plant"
 sed_power_note:0 "When the plan asks for electrical capacity (local power at least 20% above base in a state), Automatic expands the power plant one level per month in the state with costly power that accepts the building. The game itself requires the electrical generation technology; without it no state is eligible. It is the same work the Supply Chain would do. It respects the private queue, pause, fiscal guard, material budget (400 points) and the one-attempt-per-month limit."
 sed_power_needed:0 "The current objective is costly local power. This is the work Automatic can queue."
 sed_power_success:0 "Power plant request queued (+1 level). Check cost and time in the game queue."
 sed_power_failed:0 "The game did not confirm the power plant was added to the queue."
 sed_trade_center_title:0 "Trade Center"
 sed_trade_center_note:0 "When a short good has no producer in the country and no state can host the industry, Automatic may expand an existing Trade Center or found the first one in a state that accepts the building. Nothing local can make the good: the only way left is the World Market. The level buys Trade Capacity for the World Market; the Director does not open a route, does not change tariffs or subventions and does not build under Isolationism. It respects the queue, budget and one-attempt-per-month guards."
 sed_trade_center_needed:0 "With no national producer and no state able to host the industry, the Trade Center is the way to bring the good through the World Market."
 sed_trade_center_success:0 "Trade Center request queued (+1 level). Check cost and time in the game queue."
 sed_trade_center_failed:0 "The game did not confirm the Trade Center was added to the government queue."
 sed_coord_advisor_policy_1:0 "Advisor guidance applied for growth, balanced budget and borrowing disabled through its setting. The Advisor internal plan reserves twelve weeks of fixed expenses."
 sed_coord_advisor_policy_2:0 "Advisor guidance applied for standard of living, balanced budget and borrowing disabled. Essential goods lead the plan."
 sed_coord_advisor_policy_3:0 "Advisor guidance applied for treasury return and reserve protection, with borrowing disabled. Debt reached at least 50% of credit."
 sed_coord_executor_13:0 "Production method reviewed this month. The next monthly review reassesses investment."
 sed_auto_status_pm_recovered:0 "The review applied a method to reduce dependence on scarce inputs."
 sed_auto_status_modernized:0 "The review applied a production-method upgrade."
 sed_auto_status_pm_unconfirmed:0 "The method change evaluated in this review awaits confirmation."
 sed_fiscal_5:0 "Fiscal state with reserve-funded construction. Nonnegative operating balance, no debt and gold covering twelve weeks of fixed expenses plus 26 weeks of the observed deficit. The Advisor can assess investment using its own budget when the government queue is empty. The Director can also invest under its material and queue budget guard. Supply Chain paths require a nonnegative balance."
 sed_coord_intro:0 "In Automatic, the Director coordinates detected builders and applies fiscal policy. Returning to Assisted or Manual restores your original options and levels."
 sed_coord_enable:0 "Coordinate external builders"
 sed_coord_enable_tt:0 "Saves verified construction, objective and budget options, enters Automatic mode and configures one executor. May suspend power and administration routines not yet covered by the plan. Does not start construction on click. Leaving Automatic, disabling or releasing restores original options, including numeric values. Does not control PMs or other builders."
 sed_coord_release:0 "Restore options and return to Assisted"
 sed_coord_release_tt:0 "Restores options saved when taking control. Manual changes to these coordinated options during coordination will be replaced by the original options. Existing queued projects remain."
 sed_coord_executor_0:0 "Coordination active: new external construction suspended for finances, lack of priority or available executor. Existing projects continue. ARoAI and native autoexpansion are not controlled."
 sed_coord_executor_1:0 "The Director selected Economy Advisor as executor. The Director applies the objective and financial policy shown below. The Advisor selects buildings and states using its own criteria; the Director transmits general investment guidance."
 sed_coord_executor_2:0 "Selected executor: Supply Chain, railways only, to relieve infrastructure. Waits for Supply Chain scheduling and filters."
 sed_coord_executor_3:0 "Selected executor: Supply Chain, production chains. Internal categories preserved; the Director does not force a building or state."
 sed_coord_executor_5:0 "Coordination suspended: ARoAI construction detected. This adapter controls only Economy Advisor and Supply Chain; turn off the ARoAI builder to delegate using these controls."
 sed_coord_executor_4:0 "Selected executor: Supply Chain, construction sectors. Execution depends on Supply Chain scheduling and budget."
 sed_auto_status_delegated:0 "Last review: external guidance updated. This does not confirm construction insertion; the selected executor has its own schedule and filters."
 sed_plan_title:0 "National plan — current priorities"
 sed_plan_date:0 "Plan for [JournalEntry.GetCountry.MakeScope.Var('sed_plan_month').GetValue|0]/[JournalEntry.GetCountry.MakeScope.Var('sed_plan_year').GetValue|0]."
 sed_plan_policy:0 "Up to three eligible expansions compared across states and sectors. Scores combine infrastructure deficit, relative supply gap and essential goods priority. Initial policy, not predicted returns. Short term: address first priority; medium term: reassess supply and infrastructure after construction; long term: diversification and development still lack a validated model."
 sed_tax_policy:0 "Taxes under the Director: in Automatic, one change per monthly review. One step up under caution, crisis or default; one step down with positive balance, no debt and twelve weeks of fixed expenses in reserves. The original level is restored when leaving Automatic or disabling. Does not change spending or consumption tax rates."
 sed_wage_policy:0 "Government wages under the Director: in Automatic, one step down under crisis or default (floor low) and one step up with fiscal health (ceiling medium). The original level is restored when leaving Automatic or disabling. Military wages can fall during a peacetime crisis with an operating deficit, with recovery according to readiness and budget."
 sed_plan_empty:0 "No eligible expansion in the current scope. Not building is a valid outcome; see details for rejection reasons."
 sed_fiscal_1:0 "Fiscal: initial expansion conditions. Nonnegative balance and operating balance, reserves covering at least four weeks of fixed expenses and debt up to 75% of credit. This does not guarantee affordability of the next project."
 sed_fiscal_2:0 "Fiscal: caution. Initial policy suspends new automatic attempts; Assisted approval remains explicit."
 sed_fiscal_3:0 "Fiscal: crisis under the initial policy — deficit with less than four weeks of reserves, debt above 90% of credit or debt without a positive credit limit. Priority: stabilize finances."
 sed_fiscal_4:0 "Fiscal: default emergency. No expansion authorized."
 sed_goal_0:0 "Current objective: observe and preserve resources; no eligible expansion."
 sed_goal_1:0 "Current objective: relieve the infrastructure bottleneck."
 sed_goal_2:0 "Current objective: reduce goods shortages by expanding viable producers or founding the missing industry in a suitable state."
 sed_goal_3:0 "Current objective: expand capacity for government queue demand, with Assisted approval."
 sed_goal_4:0 "Current objective: stabilize finances before expanding commitments."
 sed_auto_current_fiscal:0 "Now: fiscal policy blocks new automatic attempts. Requires the usual fiscal guard or reserve financing with nonnegative operating balance, no debt and estimated construction coverage. Tax and civilian government wage policy remains active in Automatic."
 sed_auto_status_fiscal:0 "The last review did not attempt construction because of fiscal protection."
 sed_goal_6:0 "Current objective: restore administrative capacity; national bureaucracy is negative. Without Supply Chain, the Director expands government administration itself."
 sed_goal_7:0 "Current objective: restore tax capacity in incorporated states. Without Supply Chain, the Director expands government administration in the state that exceeds its capacity."
 sed_goal_8:0 "Current objective: seek growth and diversification. With no eligible bottleneck in direct scope, the external executor evaluates new investment using its own filters."
 sed_goal_9:0 "Current objective: costly local power, priced at least 20% above base in a state. Without Supply Chain, the Director expands the power plant itself; with it, the external tool does the work."
 sed_coord_supply_policy:0 "Supply Chain policy under the Director. Expansion in incorporated states; administration addresses the current bureaucracy deficit. Numeric construction limits are one level per selected location, according to the external routine. The national total may exceed one level. Tax capacity is evaluated in June/December and construction sectors in February/August. Previous settings are restored when leaving Automatic."
 sed_auto_current_budget:0 "Now: direct execution awaits material-reference coverage, construction capacity or a recognized method. Missing @money![JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_gold_gap').GetValue|K] of gold before the guard releases; check the national plan values."
 sed_candidate_labor:0 "Last labor reading. Estimated reserve after known vacancies and queues: [State.MakeScope.Var('sed_labor_available').GetValue|0]. Estimated commitments: [State.MakeScope.Var('sed_labor_committed').GetValue|0]. Demographic reference; qualifications and future migration still require assessment."
 sed_auto_status_budget:0 "Last review: next-project material benchmark is uncovered or construction method is unknown. No attempt consumed. Missing @money![JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_gold_gap').GetValue|K] of gold before the guard releases; see the direct budget in the plan."
 sed_build_budget_unknown:0 "Direct budget pending. An active sector uses a construction method outside the four verified profiles. Direct Automatic awaits recognized data; Assisted approval remains explicit."
 sed_build_budget:0 "Conservative material benchmark for the next direct project: @money![JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_weekly').GetValue|K]/week, for up to [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_points').GetValue|1] points. Sector level/occupancy material cap: @money![JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_material_capacity').GetValue|K]/week. Gold required if the balance does not cover the benchmark: @money![JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_required_gold').GetValue|K], with no debt. Uses the highest active-method cost, capped by existing sector materials, with base prices plus 75%. The first project’s estimated duration extends the required reserve; future wages, subsidies and modifiers remain outside. Missing @money![JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_gold_gap').GetValue|K] of gold before the guard releases this project; zero means the balance already covers the benchmark."
 sed_build_budget_project:0 "The first project requires [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_project_points').GetValue|0] points, estimated at [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_project_weeks').GetValue|1] weeks. The existing queue adds a reference of [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_queue_weeks').GetValue|1] weeks; the engine reports up to [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_queue_weeks_engine').GetValue|0] weeks remaining in the government queue (0 = empty, rounded up). The queue holds [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_queue_projects').GetValue|0] government projects and [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_queue_private_projects').GetValue|0] private ones. The funding window is [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_funding_weeks').GetValue|1] weeks. Completed progress, each project’s author and local efficiency remain outside the estimate."
 sed_reserve_budget:0 "Reserve budget in this reading. Standard four-week fixed-expense floor: @money![JournalEntry.GetCountry.MakeScope.Var('sed_reserve_floor').GetValue|K]. Floor required by this reading: @money![JournalEntry.GetCountry.MakeScope.Var('sed_reserve_required').GetValue|K] (six weeks while running a deficit). Gold above the floor: @money![JournalEntry.GetCountry.MakeScope.Var('sed_reserve_spare').GetValue|K]. Current deficit coverage above the floor: [JournalEntry.GetCountry.MakeScope.Var('sed_reserve_runway').GetValue|1] weeks. Estimate using current expenses and deficit; new construction costs still require assessment."
 sed_coord_executor_11:0 "Selected executor: Director, expansion of the first supply priority. Verified Advisor and Supply Chain construction options remain suspended. Waits for budget and an empty private queue; the government queue may be busy. At most one attempt per month. The review outcome confirms insertion."
 sed_coord_executor_10:0 "Coordination waiting. A building related to the current objective has a queued expansion. New external options remain suspended until queue reassessment or another eligible priority appears."
 sed_plan_waiting:0 "Plan monitoring related construction. The queue does not yet prove resolution of the bottleneck. Project origin and future impact have not been identified."
 sed_auto_status_waiting:0 "Last review: waiting for an expansion related to the objective. Reassesses after queue changes; no new external routine authorized in this review."
 sed_coord_executor_9:0 "Objective identified, execution pending. Administration, tax capacity and power require a dedicated Supply Chain routine and its fiscal conditions. The required routine is unavailable or blocked in this reading. See the national plan for the objective."
 sed_auto_status_unsupported:0 "Last review: objective identified without an authorized dedicated executor. Coordination awaits a compatible routine and fiscal conditions for this action."
