 sed_supply_title:0 "Supply priorities"
 sed_supply_intro:0 "Existing producer expansions or founding of the missing industry to address market shortages or supply another expansion."
 sed_supply_no_candidate:0 "No eligible producer in this reading. This version only expands existing buildings."
 sed_supply_blocked_private:0 "Button blocked: clear the private queue before using the Director’s government queue."
 sed_supply_blocked_default:0 "Button blocked: the country is in default."
 sed_supply_stale:0 "The shortage or building conditions changed. No action was executed; refresh the diagnosis."
 sed_supply_pending:0 "This expansion is already queued. Wait for it to complete or be cancelled before approving another."
 sed_supply_finance_caution:0 "Caution: the weekly balance is negative. Approval remains available; review cost and timing in the game queue."
 sed_limitations:0 "Prototypes are limited to operating railways or founding the first railway in a deficit state, operating construction sectors when the government queue has at least three projects, and local producers for wood, iron, coal, grain, fabric, tools, groceries, and clothes when the market reports a shortage. Supply recommendations do not estimate cost, returns, or future hiring. Approval only adds one level to the government queue; costs and timing depend on the game. A negative balance is a caution, not a blocker; default and a nonempty private queue block approval. Qualifications, wages, unemployment, and external dependence are not directly measured. GDP changes may reflect border and market changes."
 sed_assist_notice_title:0 "Director recommendation (Assisted mode)"
 sed_assist_notice_option_review:0 "Open diagnostics and review recommendations"
 sed_assist_notice_option_review_tt:0 "Refreshes diagnostics. Open the Director entry in the Journal to see recommendations and use the approval button on each item."
 sed_assist_notice_option_later:0 "Remind me later"
 sed_assist_notice_option_later_tt:0 "Hides this notice for upcoming updates this month; it may return later."
 sed_assist_notice_option_mute:0 "Mute for a few months"
 sed_assist_notice_option_mute_tt:0 "Mutes this notice for a few months. Recommendations remain in the panel and you can approve them there at any time."
 sed_assist_notice_1_desc:0 "The Director found recommendations for you to approve in Assisted mode.\n\nWhy this is recommended: The country has an infrastructure bottleneck (states with negative infrastructure). Expanding railways where infrastructure is lacking improves market access and unlocks construction and employment in those states.\n\nWhat to do now: open the Director entry in the Journal and approve the recommendation that makes sense, one by one. Each approval rechecks state, queue, budget and eligibility on click. The Director does not queue anything on its own in Assisted mode."
 sed_assist_notice_2_desc:0 "The Director found recommendations for you to approve in Assisted mode.\n\nWhy this is recommended: There are goods shortages in the market: demand exceeds supply. Expanding (or founding) viable producers of the scarce good helps reduce the shortage, ease prices and supply the chains that depend on that input.\n\nWhat to do now: open the Director entry in the Journal and approve the recommendation that makes sense, one by one. Each approval rechecks state, queue, budget and eligibility on click. The Director does not queue anything on its own in Assisted mode."
 sed_assist_notice_3_desc:0 "The Director found recommendations for you to approve in Assisted mode.\n\nWhy this is recommended: The government construction queue is under pressure and construction sector capacity is lacking. Expanding capacity allows more projects at once, but consumes materials and budget.\n\nWhat to do now: open the Director entry in the Journal and approve the recommendation that makes sense, one by one. Each approval rechecks state, queue, budget and eligibility on click. The Director does not queue anything on its own in Assisted mode."
 sed_assist_notice_4_desc:0 "The Director found recommendations for you to approve in Assisted mode.\n\nWhy this is recommended: The fiscal situation calls for caution before taking on new commitments. The Director recommends stabilizing finances first; new expansions may be held back until covered.\n\nWhat to do now: open the Director entry in the Journal and approve the recommendation that makes sense, one by one. Each approval rechecks state, queue, budget and eligibility on click. The Director does not queue anything on its own in Assisted mode."
 sed_assist_notice_5_desc:0 "The Director found recommendations for you to approve in Assisted mode.\n\nWhy this is recommended: A good is scarce with no viable local producer right now. The Director recommends founding the missing industry when a suitable state becomes available (technology, land and infrastructure), without forcing construction where it is not possible.\n\nWhat to do now: open the Director entry in the Journal and approve the recommendation that makes sense, one by one. Each approval rechecks state, queue, budget and eligibility on click. The Director does not queue anything on its own in Assisted mode."
 sed_assist_notice_6_desc:0 "The Director found recommendations for you to approve in Assisted mode.\n\nWhy this is recommended: National bureaucracy is negative. Expanding government administration restores administrative capacity, needed to sustain institutions and state functions.\n\nWhat to do now: open the Director entry in the Journal and approve the recommendation that makes sense, one by one. Each approval rechecks state, queue, budget and eligibility on click. The Director does not queue anything on its own in Assisted mode."
 sed_assist_notice_7_desc:0 "The Director found recommendations for you to approve in Assisted mode.\n\nWhy this is recommended: An incorporated state exceeds its tax capacity. Expanding government administration there helps restore local tax collection capacity.\n\nWhat to do now: open the Director entry in the Journal and approve the recommendation that makes sense, one by one. Each approval rechecks state, queue, budget and eligibility on click. The Director does not queue anything on its own in Assisted mode."
 sed_assist_notice_8_desc:0 "The Director found recommendations for you to approve in Assisted mode.\n\nWhy this is recommended: With no direct priority bottleneck right now, the objective is growth and diversification: evaluating investments that expand the economy using available filters.\n\nWhat to do now: open the Director entry in the Journal and approve the recommendation that makes sense, one by one. Each approval rechecks state, queue, budget and eligibility on click. The Director does not queue anything on its own in Assisted mode."
 sed_assist_notice_9_desc:0 "The Director found recommendations for you to approve in Assisted mode.\n\nWhy this is recommended: Local power is costly (priced at least 20% above base in some state). Expanding power generation can ease energy cost and supply for industry.\n\nWhat to do now: open the Director entry in the Journal and approve the recommendation that makes sense, one by one. Each approval rechecks state, queue, budget and eligibility on click. The Director does not queue anything on its own in Assisted mode."
 sed_import_notice_wood_title:0 "Wood shortage: import or expand?"
 sed_import_notice_wood_desc:0 "Demand for wood exceeds supply and no local expansion passed the filters this time — workers, inputs, queue, budget or infrastructure blocked the candidates. Market orders now: buy #variable [ROOT.GetCountry.MakeScope.Var('sed_import_notice_wood_buy').GetValue|D]#!, sell #variable [ROOT.GetCountry.MakeScope.Var('sed_import_notice_wood_sell').GetValue|D]#!. The difference shows the size of the gap an import would cover; it is not a cost, convoy or freight estimate.\n\nSince 1.9 there is no manual trade route: the Trade Center brings goods from abroad through the World Market. To try to import wood:\n1. Have a Trade Center (Trade group, under private infrastructure) in your market — it generates Trade Capacity. Ports in coastal states generate the Merchant Marine used for shipping.\n2. In the good’s panel in the Market, lower the import tariff and/or pay an import subvention: that makes buying abroad profitable for traders.\n3. For a direct deal, use the Goods Transfer clause in a treaty with another country (fixed weekly amount).\n4. Isolationism disables World Market trade.\n\nThe Director cannot open trade by script. Local expansion becomes possible again once a filter clears."
 sed_import_notice_wood_option_trade:0 "I will try to import through the World Market"
 sed_import_notice_wood_option_trade_tt:0 "The Director queues no wood construction and re-evaluates this notice in 12 months. Importing is your action: Trade Center, tariff or subvention in the good’s panel, a Goods Transfer treaty, and check that the law is not Isolationism."
 sed_import_notice_wood_option_plan:0 "Recompute the plan now"
 sed_import_notice_wood_option_plan_tt:0 "Refreshes diagnosis and priorities immediately, without queueing construction or changing taxes or wages."
 sed_import_notice_wood_option_mute:0 "Warn me again in 2 years"
 sed_import_notice_wood_option_mute_tt:0 "Postpones this wood notice for 24 months. The shortage stays in the diagnosis and recommendations."
 sed_wood_rejection_summary:0 "Last reading — states with a logging camp: [JournalEntry.GetCountry.MakeScope.Var('sed_wood_producer_states').GetValue|0]. Each rejected state is counted under its first applicable reason. Worker reference per level: logging camp 5000."
