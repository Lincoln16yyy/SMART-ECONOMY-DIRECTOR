 sed_restore_ignored:0 "Restore ignored recommendations"
 sed_restore_ignored_tt:0 "Clears all ignore choices in the country’s current states and refreshes analysis. Does not queue construction."
 sed_ignored_notice:0 "Some expansions are ignored by your choice. They will not be recommended or executed automatically until restored. Disabling the Director clears these choices."
