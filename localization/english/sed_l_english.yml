 sed_private_control_help:0 "The Director only reads these options; the other mod’s Private Constructions Management journal entry changes them. An enabled restriction stops private investors from opening new buildings in that branch, which reduces competition with the plan. The private queue still counts for the Director’s guards, and inbound investment policing may make the game refuse government work requested here; the refusal appears as an action failure. The Director changes and cancels none of this."
 sed_pm_external:0 "Auto-Apply PMs detected: the Director does not change main methods of buildings that mod already manages (its journal’s building or group button is on). New foundations still receive the verified initial setup. Turn that button off for the Director to modernize that type again. This reading leaves the method with whoever already controls it and does not confirm the other mod’s result."
 sed_auto_current_queue_control:0 "An occupied private queue counts for the Director’s guards even with the control active. If it was opened for buildings the Director already plans, restrict expansion in the Private Constructions Management journal entry and wait for the queue to empty. The Director changes neither the options nor existing projects."
