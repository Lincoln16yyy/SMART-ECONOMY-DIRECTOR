l_english:
 sed_ignore_recommendation:0 "Ignore in this state"
 sed_ignore_recommendation_tt:0 "Removes this expansion from recommendations and automation in this state until restored. Does not cancel construction. Applies in all three modes."
 sed_restore_ignored:0 "Restore ignored recommendations"
 sed_restore_ignored_tt:0 "Clears all ignore choices in the country’s current states and refreshes analysis. Does not queue construction."
 sed_ignored_notice:0 "Some expansions are ignored by your choice. They will not be recommended or executed automatically until restored. Disabling the Director clears these choices."
 je_sed_diagnostics:0 "Smart Economy Director"
 je_sed_diagnostics_reason:0 "National economic indicators, refreshed on request or monthly."
 sed_activation_tt:0 "Use the Enable Smart Economy Director decision."
 sed_laws_scope:0 "Laws and politics stay outside the Director: it neither proposes nor enacts laws, consumption taxes or discretionary spending. Those decisions remain with the player and dedicated mods."
 sed_laws_external:0 "Smart Government Advisor detected. That mod’s law recommendations remain in force and are not repeated here; the Director only sets general taxes, civil wages and military wages with restoration."
 sed_investment_policy:0 "Supply decisions and modernization scoring subtract the observed wage bill. The reference uses the material gain at 75% of revenue and 125% of inputs, minus the level’s employment weights times the cost per weighted job. Future prices and realized profit remain outside."
 sed_investment_wage:0 "Observed wage unit: @money![JournalEntry.GetCountry.MakeScope.Var('sed_investment_wage_unit').GetValue|2] per weighted job per week, from the country’s healthy buildings. States with their own sample use their own average, and each building type uses its own family sample when one exists; otherwise the national average applies."
 sed_investment_wage_unknown:0 "No usable wage sample. Eligibility, supplier preference and PM scoring use the material margin only."
 sed_disabled_desc:0 "Diagnostics disabled."
 sed_enable:0 "Enable Smart Economy Director"
 sed_enable_desc:0 "Opens an economic diagnosis in the journal and reads current indicators. Enabling is optional, including in existing saves."
 sed_disable_decision:0 "Disable Smart Economy Director"
 sed_disable_decision_desc:0 "Removes the diagnosis and clears its readings and history. Use the enable decision to return."
 sed_title:0 "Economy and construction"
 sed_scope_note:0 "Economic diagnosis and recommendations. Assisted allows button approval; Automatic may queue at most one level per month."
 sed_mode_title:0 "Operating mode"
 sed_mode_manual_button:0 "Manual"
 sed_mode_manual_button_tt:0 "Diagnosis and recommendations on request only. No construction is approved or executed automatically."
 sed_mode_assisted_button:0 "Assisted"
 sed_mode_assisted_button_tt:0 "Shows visible buttons so you can approve each recommended level individually. No automatic economic action."
 sed_mode_automatic_button:0 "Automatic"
 sed_mode_automatic_button_tt:0 "Coordinates detected builders and applies fiscal policy. Taxes and civilian government wages allow one adjustment per calendar month. Leaving Automatic restores previous options and levels. The direct executor allows one construction attempt per month even while the government queue is busy; the private queue must be empty. External tools follow their own limits."
 sed_mode_manual_status:0 "Manual: readings and recommendations, without construction."
 sed_mode_assisted_status:0 "Assisted: approve one expansion using its button."
 sed_mode_automatic_status:0 "Automatic is active. Periodic reviews update the plan, executor and fiscal policy and may queue one level per month while the government queue is busy, as long as the private queue is empty."
