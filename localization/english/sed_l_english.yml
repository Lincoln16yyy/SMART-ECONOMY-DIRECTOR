l_english:
 je_sed_diagnostics:0 "Smart Economy Director"
 je_sed_diagnostics_reason:0 "National economic indicators, refreshed on request or monthly."
 sed_activation_tt:0 "Use the Enable Smart Economy Director decision."
 sed_disabled_desc:0 "Diagnostics disabled."
 sed_enable:0 "Enable Smart Economy Director"
 sed_enable_desc:0 "Opens an economic diagnosis in the journal and reads current indicators. Enabling is optional, including in existing saves."
 sed_disable_decision:0 "Disable Smart Economy Director"
 sed_disable_decision_desc:0 "Removes the diagnosis and clears its readings and history. Use the enable decision to return."
 sed_title:0 "National economy — diagnosis"
 sed_scope_note:0 "Economic diagnosis and recommendations. Assisted allows button approval; Automatic may queue at most one level per month."
 sed_mode_title:0 "Operating mode"
 sed_mode_manual_button:0 "Manual"
 sed_mode_manual_button_tt:0 "Diagnosis and recommendations on request only. No construction is approved or executed automatically."
 sed_mode_assisted_button:0 "Assisted"
 sed_mode_assisted_button_tt:0 "Shows visible buttons so you can approve each recommended level individually. No automatic economic action."
 sed_mode_automatic_button:0 "Automatic"
 sed_mode_automatic_button_tt:0 "Reviews once a month and may queue at most one level if a shortage or infrastructure deficit exists, both queues are empty, the country is not in default, and no known construction automation is active. You can switch back to Assisted or Manual at any time."
 sed_mode_manual_status:0 "Manual mode is active. The Director only updates diagnosis and recommendations; action buttons remain visible but disabled."
 sed_mode_assisted_status:0 "Assisted mode is active. You decide with the visible button on each recommendation; country conditions and queues are rechecked on click."
 sed_mode_automatic_status:0 "Automatic mode is active. A monthly review may queue at most one level. Individual approval is disabled while this mode is active."
 sed_mode_approval_blocked:0 "Individual actions are available in Assisted mode. Buttons remain visible in the other modes."
 sed_auto_status_success:0 "The automatic review added one level to the government queue. Review the building and timing in the game queue."
 sed_auto_status_no_action:0 "The monthly review found no eligible action. No construction was queued."
 sed_auto_status_default:0 "The automatic review was suspended because the country is in default."
 sed_auto_status_queue:0 "The automatic review did not queue construction because the government or private queue is already occupied."
 sed_auto_status_paused:0 "The automatic review did not queue construction because construction is paused."
 sed_auto_status_competing:0 "The automatic review was suspended because another known construction automation is active."
 sed_auto_status_safety:0 "The automatic review was suspended by an unclassified safety condition. No construction was queued."
 sed_auto_status_unconfirmed:0 "The automatic review selected an expansion but did not confirm its addition to the government queue. Check the game queue. This review did not attempt another expansion."
 sed_refresh:0 "Refresh diagnosis"
 sed_refresh_tt:0 "Read this country’s indicators again."
 sed_disable:0 "Disable"
 sed_disable_tt:0 "Clear the Director’s readings and history and close the diagnosis."
 sed_use_manual:0 "Refresh on request"
 sed_use_manual_tt:0 "Suspend monthly readings. Use Refresh diagnosis whenever you want a new reading."
 sed_use_monthly:0 "Refresh every month"
 sed_use_monthly_tt:0 "Refresh now and read indicators on the monthly pulse."
 sed_last_refresh:0 "Last reading: [JournalEntry.GetCountry.MakeScope.Var('sed_last_month').GetValue|0]/[JournalEntry.GetCountry.MakeScope.Var('sed_last_year').GetValue|0]."
 sed_schedule_monthly:0 "Monthly readings enabled. Figures represent the last reading."
 sed_schedule_manual:0 "Readings on request. Figures stay recorded until you refresh."
 sed_default_warning:0 "#N The country was in default at the last reading.#!"
 sed_operating_warning:0 "#N The balance without temporary items is negative: pressure extends beyond temporary spending.#!"
 sed_deficit_warning:0 "#warning The weekly balance is negative. Check commitments and the budget before increasing spending.#!"
 sed_nonnegative_note:0 "The weekly balance is nonnegative. This alone does not establish sustainability or room to invest."
 sed_finance_title:0 "Public finances"
 sed_development_title:0 "Development and population"
 sed_production_title:0 "Construction and production conditions"
 sed_debt_share_text:0 "Debt / credit limit: [JournalEntry.GetCountry.MakeScope.Var('sed_debt_share').GetValue|%1]"
 sed_debt_share_unavailable:0 "Debt / credit: unavailable, credit limit is not positive."
 sed_runway_text:0 "Reserves / current deficit: [JournalEntry.GetCountry.MakeScope.Var('sed_reserve_weeks').GetValue|1] weeks at the current balance, excluding credit."
 sed_runway_unavailable:0 "Reserves / deficit: not applicable with a nonnegative balance."
 sed_per_capita_text:0 "GDP per capita: @money![JournalEntry.GetCountry.MakeScope.Var('sed_gdp_per_capita').GetValue|2]"
 sed_per_capita_unavailable:0 "GDP per capita: unavailable, population is not positive."
 sed_growth_text:0 "GDP change since the previous baseline reading: [JournalEntry.GetCountry.MakeScope.Var('sed_growth').GetValue|%1]. Recorded calendar-month separation: [JournalEntry.GetCountry.MakeScope.Var('sed_growth_months').GetValue|0]."
 sed_growth_unavailable:0 "GDP change: requires a reading in another month with a positive baseline."
 sed_state_readings:0 "States examined: [JournalEntry.GetCountry.MakeScope.Var('sed_states').GetValue|0] · Negative infrastructure: [JournalEntry.GetCountry.MakeScope.Var('sed_infrastructure_short_states').GetValue|0] · Market access below 100%: [JournalEntry.GetCountry.MakeScope.Var('sed_low_access_states').GetValue|0]"
 sed_employment_readings:0 "Buildings short of inputs: [JournalEntry.GetCountry.MakeScope.Var('sed_shortage_buildings').GetValue|0] · Incomplete staffing: [JournalEntry.GetCountry.MakeScope.Var('sed_understaffed_buildings').GetValue|0] · Failed hires: [JournalEntry.GetCountry.MakeScope.Var('sed_hiring_failure_buildings').GetValue|0]"
 sed_limitations_title:0 "How to interpret"
 sed_recommendations_title:0 "Infrastructure opportunities"
 sed_recommendations_intro:0 "Prototype: up to three operating railways in incorporated states with negative infrastructure. The analysis does not calculate cost or return; approve one action at a time and review the budget."
 sed_no_infrastructure_opportunity:0 "No current infrastructure deficit in the country’s states. The Director does not recommend railway expansion now."
 sed_no_railway_candidate:0 "Infrastructure deficits exist, but no railway passed the operation, hiring, input, and queue filters."
 sed_railway_breakdown:0 "States with an infrastructure deficit: [JournalEntry.GetCountry.MakeScope.Var('sed_railway_deficit_states').GetValue|0] · No railway: [JournalEntry.GetCountry.MakeScope.Var('sed_railway_no_railway_states').GetValue|0] · Railway not operating: [JournalEntry.GetCountry.MakeScope.Var('sed_railway_not_ready_states').GetValue|0] · Blocked by incorporation or permission: [JournalEntry.GetCountry.MakeScope.Var('sed_railway_blocked_states').GetValue|0]. Each state is counted under one primary reason."
 sed_railway_candidate_title:0 "#bold [State.GetName]#! — infrastructure balance: #v [State.GetInfrastructureBalance|0+=]#!"
 sed_railway_candidate_reason:0 "The railway is staffed, has no input shortage, and has no queued expansion. One government level may relieve the bottleneck; future impact and cost are not forecast."
 sed_approve_railway:0 "Approve: queue 1 government level"
 sed_approve_railway_tt:0 "Requires Assisted mode, no default, and an empty private queue; state and queues are rechecked on click. A negative weekly balance raises a caution but does not block. Uses the normal game queue."
 sed_railway_blocked_private:0 "Button blocked: the private queue has levels."
 sed_railway_blocked_default:0 "Button blocked: the country is in default."
 sed_railway_stale:0 "This recommendation changed since the last reading. No action was executed; refresh the diagnosis before approving."
 sed_railway_pending:0 "This expansion is already queued. Do not approve again; the marker clears on a reading after completion or cancellation."
 sed_railway_finance_caution:0 "Caution: the weekly balance is negative. Approval remains available; review the queue cost and timing before proceeding."
 sed_railway_action_success:0 "Request added to the government queue. Review cost and timing in the game queue."
 sed_railway_action_failed:0 "The engine did not confirm the queue addition. No automatic retry will occur."
 sed_construction_title:0 "Construction capacity"
 sed_construction_intro:0 "Prototype: one existing, staffed construction sector in an incorporated state when the government queue has at least three projects. The analysis does not calculate cost or return; approve one action at a time and review the budget."
 sed_no_construction_queue:0 "The government queue has fewer than three projects. The Director does not recommend expanding construction capacity now."
 sed_no_construction_candidate:0 "The government queue is long enough, but no construction sector passed the operation, hiring, input, and queue filters."
 sed_construction_breakdown:0 "States with a construction sector: [JournalEntry.GetCountry.MakeScope.Var('sed_construction_sector_states').GetValue|0] · Sector not operating: [JournalEntry.GetCountry.MakeScope.Var('sed_construction_not_ready_states').GetValue|0] · Blocked by incorporation or permission: [JournalEntry.GetCountry.MakeScope.Var('sed_construction_blocked_states').GetValue|0]. Each state is counted under one primary reason."
 sed_construction_candidate_title:0 "#bold [State.GetName]#! — construction sector"
 sed_construction_candidate_reason:0 "The sector is staffed, has no input shortage, and has no queued expansion. One government level may raise capacity; future impact, cost, and timing are not forecast."
 sed_approve_construction:0 "Approve: queue 1 construction sector level"
 sed_approve_construction_tt:0 "Requires Assisted mode, at least three government projects queued, no default, and an empty private queue; state and queues are rechecked on click. A negative weekly balance raises a caution but does not block. Uses the normal game queue."
 sed_construction_blocked_queue:0 "Button blocked: the government queue has fewer than three projects."
 sed_construction_blocked_private:0 "Button blocked: the private queue has levels."
 sed_construction_blocked_default:0 "Button blocked: the country is in default."
 sed_construction_stale:0 "This recommendation changed since the last reading. No action was executed; refresh the diagnosis before approving."
 sed_construction_pending:0 "This expansion is already queued. Do not approve again; the marker clears on a reading after completion or cancellation."
 sed_construction_finance_caution:0 "Caution: the weekly balance is negative. Approval remains available; review the queue cost and timing before proceeding."
 sed_construction_action_success:0 "Construction sector request added to the government queue. Review cost and timing in the game queue."
 sed_construction_action_failed:0 "The engine did not confirm the construction sector queue addition. No automatic retry will occur."
 sed_supply_title:0 "Supply for market shortages"
 sed_supply_intro:0 "Shown when a market good is scarce and an operating local producer exists. The recommendation does not forecast prices, returns, or cost; the button only queues one government level after your approval."
 sed_supply_no_candidate:0 "The market reports a shortage, but no local producer passed the operation, incorporation, and queue filters. This version does not recommend a new building."
 sed_supply_blocked_private:0 "Button blocked: clear the private queue before using the Director’s government queue."
 sed_supply_blocked_default:0 "Button blocked: the country is in default."
 sed_supply_stale:0 "The shortage or building conditions changed. No action was executed; refresh the diagnosis."
 sed_supply_pending:0 "This expansion is already queued. Wait for it to complete or be cancelled before approving another."
 sed_supply_finance_caution:0 "Caution: the weekly balance is negative. Approval remains available; review cost and timing in the game queue."
 sed_limitations:0 "Prototypes are limited to operating railways with negative infrastructure, operating construction sectors when the government queue has at least three projects, and local producers for wood, iron, coal, grain, fabric, tools, groceries, and clothes when the market reports a shortage. Supply recommendations do not estimate cost, returns, or future hiring. Approval only adds one level to the government queue; costs and timing depend on the game. A negative balance is a caution, not a blocker; default and a nonempty private queue block approval. Qualifications, wages, unemployment, and external dependence are not directly measured. GDP changes may reflect border and market changes."
