 sed_import_notice_artillery_desc:0 "Demand for artillery exceeds supply and no local expansion passed the filters this time — workers, inputs, queue, budget or infrastructure blocked the candidates. Market orders now: buy #variable [ROOT.GetCountry.MakeScope.Var('sed_import_notice_artillery_buy').GetValue|D]#!, sell #variable [ROOT.GetCountry.MakeScope.Var('sed_import_notice_artillery_sell').GetValue|D]#!. The difference shows the size of the gap an import would cover; it is not a cost, convoy or freight estimate.\n\nSince 1.9 there is no manual trade route: the Trade Center brings goods from abroad through the World Market. To try to import artillery:\n1. Have a Trade Center (Trade group, under private infrastructure) in your market — it generates Trade Capacity. Ports in coastal states generate the Merchant Marine used for shipping.\n2. In the good’s panel in the Market, lower the import tariff and/or pay an import subvention: that makes buying abroad profitable for traders.\n3. For a direct deal, use the Goods Transfer clause in a treaty with another country (fixed weekly amount).\n4. Isolationism disables World Market trade.\n\nThe Director cannot open trade by script. Local expansion becomes possible again once a filter clears."
 sed_import_notice_artillery_option_trade:0 "I will try to import through the World Market"
 sed_import_notice_artillery_option_trade_tt:0 "The Director queues no artillery construction and re-evaluates this notice in 12 months. Importing is your action: Trade Center, tariff or subvention in the good’s panel, a Goods Transfer treaty, and check that the law is not Isolationism."
 sed_import_notice_artillery_option_plan:0 "Recompute the plan now"
 sed_import_notice_artillery_option_plan_tt:0 "Refreshes diagnosis and priorities immediately, without queueing construction or changing taxes or wages."
 sed_import_notice_artillery_option_mute:0 "Warn me again in 2 years"
 sed_import_notice_artillery_option_mute_tt:0 "Postpones this artillery notice for 24 months. The shortage stays in the diagnosis and recommendations."
