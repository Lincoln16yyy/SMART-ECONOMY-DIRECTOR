 sed_coord_intro:0 "No Automático, o Director coordena os construtores detectados e aplica a política fiscal. Voltar para Assistido ou Manual restaura suas opções e níveis originais."
 sed_coord_enable:0 "Coordenar construtores externos"
 sed_coord_enable_tt:0 "Guarda as opções verificadas de construção, objetivo e orçamento, entra no Automático e configura um executor. Pode suspender rotinas de energia e administração que o plano ainda não cobre. Não inicia obra neste clique. Sair do Automático, desativar ou liberar restaura as opções originais, inclusive valores numéricos. Não controla PMs ou outros construtores."
 sed_coord_release:0 "Restaurar opções e voltar ao Assistido"
 sed_coord_release_tt:0 "Restaura as opções guardadas ao assumir o controle. Mudanças manuais feitas nessas opções coordenadas durante a coordenação serão substituídas pelas opções originais. Obras já na fila permanecem."
 sed_coord_executor_0:0 "Coordenação ativa: novas construções externas suspensas por finanças, ausência de prioridade ou executor disponível. Projetos existentes continuam. ARoAI e autoexpansões nativas não são controlados."
 sed_coord_executor_1:0 "Executor escolhido pelo Director é o Economy Advisor. O Director aplica o objetivo e a política financeira mostrados abaixo. O Advisor escolhe prédios e estados pelos próprios critérios; o Director transmite orientação geral de investimento."
 sed_coord_executor_2:0 "Executor escolhido: Supply Chain, somente ferrovias, para aliviar infraestrutura. Aguarda a agenda e os filtros do Supply Chain."
 sed_coord_executor_3:0 "Executor escolhido: Supply Chain, cadeias produtivas. Categorias internas preservadas; o Director não força um prédio ou estado."
 sed_coord_executor_5:0 "Coordenação suspensa: construção do ARoAI detectada. Este adaptador controla somente Economy Advisor e Supply Chain; desligue o construtor do ARoAI para delegar com estes controles."
 sed_coord_executor_4:0 "Executor escolhido: Supply Chain, setores de construção. A execução depende da agenda e do orçamento do Supply Chain."
 sed_auto_status_delegated:0 "Última revisão: orientação externa atualizada. Isto não confirma inclusão de obra; o executor escolhido tem agenda e filtros próprios."
 sed_plan_title:0 "Plano nacional — prioridades atuais"
 sed_plan_date:0 "Plano de [JournalEntry.GetCountry.MakeScope.Var('sed_plan_month').GetValue|0]/[JournalEntry.GetCountry.MakeScope.Var('sed_plan_year').GetValue|0]."
 sed_plan_policy:0 "Até três expansões elegíveis, comparadas entre estados e setores. Pontos combinam déficit de infraestrutura, falta relativa de oferta e prioridade a bens essenciais. São uma regra inicial, não retorno previsto. Curto prazo: tratar a primeira prioridade; médio prazo: reavaliar oferta e infraestrutura após a obra; longo prazo: diversificação e desenvolvimento ainda sem modelo validado."
 sed_tax_policy:0 "Impostos sob o Director: no Automático, uma alteração por revisão mensal. Sobe um nível em cautela, crise ou default; desce um nível com saldo positivo, sem dívida e reservas de doze semanas de despesas fixas. O nível original é restaurado ao sair do Automático ou desativar. Não altera despesas ou alíquotas de consumo."
 sed_wage_policy:0 "Salários do governo sob o Director: no Automático, caem um nível em crise ou default (mínimo baixo) e sobem um nível com saúde fiscal (máximo médio). O nível original é restaurado ao sair do Automático ou desativar. Salários militares podem cair em crise com déficit operacional durante a paz, com recuperação conforme prontidão e orçamento."
 sed_plan_empty:0 "Sem expansão elegível no escopo atual. Não construir é um resultado válido; consulte os detalhes para os motivos."
 sed_fiscal_1:0 "Fiscal: condições iniciais para expansão. Saldo e saldo operacional não negativos, reservas de ao menos quatro semanas de despesas fixas e dívida até 75% do crédito. Isso não garante capacidade de pagar a próxima obra."
 sed_fiscal_2:0 "Fiscal: cautela. A política inicial suspende novas tentativas automáticas; aprovação Assistida continua explícita."
 sed_fiscal_3:0 "Fiscal: crise pela política inicial — déficit com menos de quatro semanas de reservas, dívida acima de 90% do crédito ou dívida sem limite de crédito positivo. Prioridade: estabilizar as finanças."
 sed_fiscal_4:0 "Fiscal: emergência por inadimplência. Nenhuma expansão autorizada."
 sed_goal_0:0 "Objetivo atual: observar e preservar recursos; sem expansão elegível."
 sed_goal_1:0 "Objetivo atual: aliviar o gargalo de infraestrutura."
 sed_goal_2:0 "Objetivo atual: reduzir escassez de bens ampliando produtores viáveis ou fundando a indústria ausente em estado apto."
 sed_goal_3:0 "Objetivo atual: ampliar capacidade para a demanda da fila pública, com aprovação Assistida."
 sed_goal_4:0 "Objetivo atual: estabilizar as finanças antes de ampliar compromissos."
 sed_auto_current_fiscal:0 "Agora: política fiscal bloqueia novas tentativas automáticas. Requer a guarda fiscal habitual ou financiamento por reservas com saldo operacional não negativo, sem dívida e cobertura estimada das obras. A política de impostos e salários civis continua ativa no Automático."
 sed_auto_status_fiscal:0 "A última revisão não tentou obra por proteção fiscal."
 sed_goal_6:0 "Objetivo atual: recuperar capacidade administrativa; burocracia nacional negativa."
 sed_goal_7:0 "Objetivo atual: recuperar capacidade tributária em estados incorporados. A ação depende da rotina tributária do Supply Chain."
 sed_goal_8:0 "Objetivo atual: buscar crescimento e diversificação. Sem gargalo elegível no escopo direto, o executor externo avalia novos investimentos com seus próprios filtros."
 sed_goal_9:0 "Objetivo atual: investigar energia local cara, com preço ao menos 20% acima da base em algum estado. A ferramenta externa verifica viabilidade."
 sed_coord_supply_policy:0 "Política do Supply Chain sob o Director. Expansões em estados incorporados; administração trata o déficit atual de burocracia. Limites numéricos de construção em um nível por local escolhido, conforme a rotina externa. A soma nacional pode superar um nível. Tributação é avaliada em junho/dezembro e setores em fevereiro/agosto. Opções anteriores são restauradas ao sair do Automático."
 sed_auto_current_budget:0 "Agora: orçamento direto aguarda cobertura da referência de materiais, capacidade de construção ou método reconhecido. Confira os valores no plano nacional."
 sed_candidate_labor:0 "Última leitura de mão de obra. Reserva estimada após vagas e filas conhecidas: [State.MakeScope.Var('sed_labor_available').GetValue|0]. Compromissos estimados: [State.MakeScope.Var('sed_labor_committed').GetValue|0]. Referência demográfica; qualificações e migração futura ainda precisam de avaliação."
 sed_auto_status_budget:0 "Última revisão: referência de materiais da próxima obra sem cobertura ou método de construção desconhecido. Nenhuma tentativa consumida. Confira o orçamento direto no plano."
 sed_build_budget_unknown:0 "Orçamento direto pendente. Um setor ativo usa método de construção fora dos quatro perfis verificados. O Automático direto aguarda uma leitura reconhecida; aprovação Assistida permanece explícita."
 sed_build_budget:0 "Referência conservadora para materiais da próxima obra direta: @money![JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_weekly').GetValue|K]/semana, para até [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_points').GetValue|1] pontos. Teto de materiais pelos níveis e ocupação dos setores: @money![JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_material_capacity').GetValue|K]/semana. Ouro exigido se o saldo não cobrir a referência: @money![JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_required_gold').GetValue|K], com ausência de dívida. Usa o maior custo entre métodos ativos, limitado pelos materiais dos setores existentes, com preços-base acrescidos de 75%. A duração estimada do primeiro projeto amplia a reserva exigida; salários futuros, subsídios e modificadores continuam fora."
 sed_build_budget_project:0 "O primeiro projeto requer [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_project_points').GetValue|0] pontos, estimados em [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_project_weeks').GetValue|1] semanas. A fila existente acrescenta uma referência de [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_queue_weeks').GetValue|1] semanas. A janela de financiamento é de [JournalEntry.GetCountry.MakeScope.Var('sed_build_budget_funding_weeks').GetValue|1] semanas. Progresso já executado e eficiência local seguem fora da estimativa."
 sed_coord_executor_12:0 "Ritmo por reservas: aguardando a fila pública existente. Com déficit financiado por ouro, novas autorizações externas ficam suspensas enquanto houver níveis públicos enfileirados. A política fiscal continua ativa e o orçamento é reavaliado nas revisões."
 sed_auto_status_reserve_queue:0 "Última revisão: preservação de reservas, aguardando obras públicas já enfileiradas antes de autorizar novos investimentos."
 sed_reserve_budget:0 "Orçamento por reservas nesta leitura. Piso de doze semanas de despesas fixas: @money![JournalEntry.GetCountry.MakeScope.Var('sed_reserve_floor').GetValue|K]. Ouro acima do piso: @money![JournalEntry.GetCountry.MakeScope.Var('sed_reserve_spare').GetValue|K]. Cobertura do déficit atual acima do piso: [JournalEntry.GetCountry.MakeScope.Var('sed_reserve_runway').GetValue|1] semanas. Ouro exigido pela regra de 26 semanas: @money![JournalEntry.GetCountry.MakeScope.Var('sed_reserve_required').GetValue|K]. Estimativa com despesas e déficit atuais; custo de novas obras ainda precisa ser avaliado."
 sed_coord_executor_11:0 "Executor escolhido: Director, expansão da primeira prioridade de oferta. As opções verificadas de construção do Advisor e Supply Chain ficam suspensas. Aguarda orçamento e fila privada livre; a fila pública pode estar ocupada. No máximo uma tentativa por mês. O resultado da revisão confirma se houve inclusão."
 sed_coord_executor_10:0 "Coordenação em espera. Há expansão enfileirada de um prédio relacionado ao objetivo atual. Novas opções externas ficam suspensas até reavaliar a fila ou surgir outra prioridade elegível."
 sed_plan_waiting:0 "Plano em acompanhamento de obra relacionada. A fila ainda não comprova resolução do gargalo. A autoria e o efeito futuro do projeto não foram identificados."
 sed_auto_status_waiting:0 "Última revisão: aguardando expansão relacionada ao objetivo. Reavalia após mudança da fila; nenhuma nova rotina externa autorizada nesta revisão."
 sed_coord_executor_9:0 "Objetivo identificado, execução pendente. Administração, capacidade tributária e energia exigem uma rotina específica do Supply Chain e condições fiscais próprias. A rotina necessária está indisponível ou bloqueada nesta leitura. Confira o objetivo no plano nacional."
 sed_auto_status_unsupported:0 "Última revisão: objetivo identificado sem executor específico autorizado. A coordenação aguarda uma rotina compatível e condições fiscais para essa ação."
 sed_coord_executor_6:0 "Executor escolhido: Supply Chain, administração geral. Aguarda a agenda e os filtros de burocracia do Supply Chain."
 sed_coord_executor_7:0 "Executor escolhido: Supply Chain, administração tributária. Não altera impostos; busca capacidade administrativa conforme os filtros externos."
 sed_coord_executor_8:0 "Executor escolhido: Supply Chain, energia. Preço local alto é sinal de investigação, não garantia de lucro ou falta física de oferta."
 sed_tax_last_command:0 "Último comando do Director para impostos: [JournalEntry.GetCountry.MakeScope.Var('sed_tax_last_month').GetValue|0]/[JournalEntry.GetCountry.MakeScope.Var('sed_tax_last_year').GetValue|0], nível [JournalEntry.GetCountry.MakeScope.Var('sed_tax_last_from').GetValue|0] → [JournalEntry.GetCountry.MakeScope.Var('sed_tax_last_to').GetValue|0]. Escala de 1 (muito baixo) a 5 (muito alto). Confira o resultado no orçamento."
 sed_wage_last_command:0 "Último comando do Director para salários civis: [JournalEntry.GetCountry.MakeScope.Var('sed_wage_last_month').GetValue|0]/[JournalEntry.GetCountry.MakeScope.Var('sed_wage_last_year').GetValue|0], nível [JournalEntry.GetCountry.MakeScope.Var('sed_wage_last_from').GetValue|0] → [JournalEntry.GetCountry.MakeScope.Var('sed_wage_last_to').GetValue|0]. Escala de 1 (muito baixo) a 5 (muito alto). Confira o resultado no orçamento."
 sed_goal_5:0 "Objetivo atual: fundar a indústria ausente para bens em escassez. Nenhum estado incorporado pode hospedar o produtor agora, por tecnologia, terra ou infraestrutura; o Director aguarda uma leitura que abra um local apto e não força a construção."
 sed_plan_missing_wood:0 "Setor a fundar: madeira em escassez no mercado, sem produtor verificado (acampamento madeireiro) nos estados do país. O Director funda a base quando há estado incorporado apto, sob as guardas fiscais, de materiais e de fila. Importação ou outros produtores podem suprir o bem; não é ordem de autossuficiência."
 sed_book_wood:0 "Histórico de madeira: [JournalEntry.GetCountry.MakeScope.Var('sed_wood_intents').GetValue|0] pedidos, [JournalEntry.GetCountry.MakeScope.Var('sed_wood_completed').GetValue|0] concluídos, [JournalEntry.GetCountry.MakeScope.Var('sed_wood_abandoned').GetValue|0] abandonados. Conclusão inferida quando o nível do produtor sobe ao sair da fila; cancelamento ou obra externa podem distorcer a leitura."
 sed_meta_wood:0 "Meta industrial anual: ampliar a oferta de madeira. A escassez foi observada em três meses de calendário consecutivos; ele mantém prioridade no plano até o fim do ano. A meta não dispensa os filtros de trabalhadores, insumos, fila, infraestrutura e proteção fiscal."
