 sed_construction_candidate_title:0 "#bold [State.GetName]#! — setor de construção"
 sed_construction_candidate_reason:0 "O setor está empregado, sem falta de insumos nem expansão já enfileirada. Um nível público pode aumentar a capacidade; o efeito, o custo e o prazo futuros não são previstos."
