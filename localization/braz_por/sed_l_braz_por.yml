l_braz_por:
 je_sed_diagnostics:0 "Smart Economy Director"
 je_sed_diagnostics_reason:0 "Indicadores econômicos do país, atualizados sob solicitação ou todo mês."
 sed_activation_tt:0 "Ative o Director pela decisão Ativar Smart Economy Director."
 sed_disabled_desc:0 "Diagnóstico desativado."
 sed_enable:0 "Ativar Smart Economy Director"
 sed_enable_desc:0 "Abre um diagnóstico econômico no diário e lê os indicadores atuais. A ativação é opcional, inclusive em saves existentes."
 sed_disable_decision:0 "Desativar Smart Economy Director"
 sed_disable_decision_desc:0 "Remove o diagnóstico e limpa seus indicadores e histórico. Para voltar, use a decisão de ativação."
 sed_title:0 "Economia nacional — diagnóstico"
 sed_scope_note:0 "Diagnóstico e recomendações. Assistido permite aprovação por botão; Automático pode enfileirar no máximo um nível por mês."
 sed_mode_title:0 "Modo de operação"
 sed_mode_manual_button:0 "Manual"
 sed_mode_manual_button_tt:0 "Somente diagnóstico e recomendações sob solicitação. Nenhuma construção é aprovada ou executada automaticamente."
 sed_mode_assisted_button:0 "Assistido"
 sed_mode_assisted_button_tt:0 "Mostra botões visíveis para você aprovar individualmente cada nível recomendado. Nenhuma ação econômica automática."
 sed_mode_automatic_button:0 "Automático"
 sed_mode_automatic_button_tt:0 "Revisa uma vez por mês e pode enfileirar no máximo um nível se houver escassez ou déficit de infraestrutura, a fila pública e privada estiverem vazias, o país não estiver em inadimplência e nenhum dos construtores conhecidos estiver ativo. Você pode voltar a Assistido ou Manual a qualquer momento."
 sed_mode_manual_status:0 "Modo Manual ativo. O Director só atualiza diagnóstico e recomendações; os botões de ação ficam visíveis, mas desativados."
 sed_mode_assisted_status:0 "Modo Assistido ativo. Você decide pelo botão visível de cada recomendação; a condição do país e a fila são revalidadas no clique."
 sed_mode_automatic_status:0 "Modo Automático ativo. Uma revisão mensal pode enfileirar no máximo um nível. A aprovação individual fica desativada enquanto este modo estiver ativo."
 sed_mode_approval_blocked:0 "Ação individual disponível no modo Assistido. Os botões continuam visíveis nos outros modos."
 sed_auto_status_success:0 "A revisão automática adicionou um nível à fila pública. Confira o prédio e o prazo na fila do jogo."
