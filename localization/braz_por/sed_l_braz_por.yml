 sed_construction_blocked_balance:0 "Botão bloqueado: saldo semanal negativo."
 sed_construction_action_success:0 "Pedido do setor de construção adicionado à fila pública. Confira os custos e o prazo na fila do jogo."
 sed_construction_action_failed:0 "A engine não confirmou a inclusão do setor de construção na fila. Nenhuma nova tentativa será automática."
 sed_limitations:0 "Protótipos limitados a ferrovias operantes com infraestrutura negativa e a setores de construção operantes com fila pública de ao menos três projetos. Não estima custo, contratação futura ou retorno. A aprovação apenas adiciona um nível à fila pública; os custos e o tempo dependem do jogo. Qualificações, salários, desempregados e dependência externa ainda não são medidos diretamente. Edifícios com contratação incompleta não equivalem a desempregados. As filas mostram projetos, não níveis nem custos futuros. A alfabetização segue a abrangência do indicador do jogo. Variações de PIB podem refletir mudanças de fronteira e mercado. O setor de construção depende de trabalhadores e insumos disponíveis; a recomendação não garante que o novo nível será contratado."
