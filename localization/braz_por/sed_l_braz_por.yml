 sed_supply_title:0 "Oferta para escassez de mercado"
 sed_supply_intro:0 "Aparece quando o mercado registra escassez e há um produtor local operante. A recomendação não prevê preço, retorno ou custo; o botão apenas enfileira um nível público após sua aprovação."
